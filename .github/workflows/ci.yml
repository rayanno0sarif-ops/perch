name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Perch/Perch.csproj -c Release
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Perch for Mac
        working-directory: PerchMac
        run: ./build.sh
